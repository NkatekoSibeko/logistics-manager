<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logistics Manager</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; }
    h1 { margin-bottom: 8px; }
    form { display: grid; gap: 8px; margin: 20px 0; }
    input, select, button { padding: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    .actions { display: flex; gap: 6px; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h1>Logistics Manager</h1>
  <p>Track, update, and manage shipments</p>

  <form id="shipmentForm">
    <input id="shipmentId" placeholder="Shipment ID" required />
    <input id="customer" placeholder="Customer name" required />
    <input id="deliveryDate" type="date" required />
    <select id="status" required>
      <option value="Pending">Pending</option>
      <option value="In Transit">In Transit</option>
      <option value="Delivered">Delivered</option>
    </select>
    <button type="submit" id="submitBtn">Add shipment</button>
    <button type="button" id="cancelEditBtn" hidden>Cancel edit</button>
  </form>

  <h2>Shipments</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Customer</th>
        <th>Delivery date</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="shipmentList"></tbody>
  </table>

  <script>
    const form = document.getElementById("shipmentForm");
    const list = document.getElementById("shipmentList");
    const submitBtn = document.getElementById("submitBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");

    let shipments = JSON.parse(localStorage.getItem("shipments") || "[]");
    let editIndex = null;

    function save() {
      localStorage.setItem("shipments", JSON.stringify(shipments));
    }

    function resetForm() {
      form.reset();
      editIndex = null;
      submitBtn.textContent = "Add shipment";
      cancelEditBtn.hidden = true;
    }

    function render() {
      list.innerHTML = shipments.map((s, index) => `
        <tr>
          <td>${s.id}</td>
          <td>${s.customer}</td>
          <td>${s.deliveryDate}</td>
          <td>${s.status}</td>
          <td class="actions">
            <button type="button" onclick="startEdit(${index})">Edit</button>
            <button type="button" onclick="removeShipment(${index})">Delete</button>
          </td>
        </tr>
      `).join("");
    }

    window.startEdit = function(index) {
      const s = shipments[index];
      document.getElementById("shipmentId").value = s.id;
      document.getElementById("customer").value = s.customer;
      document.getElementById("deliveryDate").value = s.deliveryDate;
      document.getElementById("status").value = s.status;
      editIndex = index;
      submitBtn.textContent = "Update shipment";
      cancelEditBtn.hidden = false;
    };

    window.removeShipment = function(index) {
      if (!confirm("Delete this shipment?")) return;
      shipments.splice(index, 1);
      save();
      render();
      resetForm();
    };

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const shipment = {
        id: document.getElementById("shipmentId").value.trim(),
        customer: document.getElementById("customer").value.trim(),
        deliveryDate: document.getElementById("deliveryDate").value,
        status: document.getElementById("status").value
      };

      if (editIndex === null) {
        shipments.push(shipment);
      } else {
        shipments[editIndex] = shipment;
      }

      save();
      render();
      resetForm();
    });

    cancelEditBtn.addEventListener("click", resetForm);
    render();
  </script>
</body>
</html>
